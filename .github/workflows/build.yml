name: Build ESP32-C3 firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile firmware
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio==6.1.18

      - name: Install esptool
        run: python -m pip install --upgrade esptool

      - name: Build ESP32-C3 firmware
        run: pio run -v

      - name: Package firmware
        run: |
          mkdir -p dist/firmware
          BUILD=.pio/build/esp32-c3-devkitm-1

          test -s "$BUILD/firmware.bin"
          test -s "$BUILD/firmware.elf"
          test -s "$BUILD/partitions.bin"
          test -s "$BUILD/bootloader.bin"

          cp "$BUILD/firmware.bin" dist/firmware/firmware.bin
          cp "$BUILD/firmware.elf" dist/firmware/firmware.elf
          cp "$BUILD/partitions.bin" dist/firmware/partitions.bin
          cp "$BUILD/bootloader.bin" dist/firmware/bootloader.bin

          echo "Downloading boot_app0.bin"
          curl -fsSL -o dist/firmware/boot_app0.bin             https://github.com/espressif/arduino-esp32/raw/refs/heads/master/tools/partitions/boot_app0.bin

          test -s dist/firmware/boot_app0.bin

          python -m esptool --chip esp32c3 merge-bin             -o dist/firmware/factory.bin             --pad-to-size 4MB             --flash-mode keep             --flash-freq keep             --flash-size keep             0x0 "$BUILD/bootloader.bin"             0x8000 "$BUILD/partitions.bin"             0xe000 dist/firmware/boot_app0.bin             0x10000 "$BUILD/firmware.bin"

          test -s dist/firmware/factory.bin
          test "$(stat -c%s dist/firmware/factory.bin)" -eq 4194304

          cat > dist/flash.bat <<'EOF'
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          title ESP32-C3 PC Relay Firmware Flasher
          echo.
          echo ========================================
          echo   ESP32-C3 PC Relay Firmware Flasher
          echo ========================================
          echo.
          where gh >nul 2>&1
          if errorlevel 1 (
              echo ERROR: GitHub CLI ^(gh^) was not found.
              echo Install GitHub CLI before using this flasher.
              echo.
              pause
              exit /b 1
          )
          if not defined GH_TOKEN (
              echo GitHub token is not configured.
              echo.
              echo Enter your GitHub fine-grained token.
              echo It will be saved for future runs as the Windows user variable GH_TOKEN.
              echo.
              for /f "delims=" %%T in ('powershell -NoProfile -Command "$s=Read-Host Token -AsSecureString; $b=[Runtime.InteropServices.Marshal]::SecureStringToBSTR($s); try { $t=[Runtime.InteropServices.Marshal]::PtrToStringBSTR($b); [Environment]::SetEnvironmentVariable('GH_TOKEN',$t,'User'); $t } finally { [Runtime.InteropServices.Marshal]::ZeroFreeBSTR($b) }"') do set "GH_TOKEN=%%T"
              echo.
              if not defined GH_TOKEN (
                  echo ERROR: Token was not saved.
                  echo.
                  pause
                  exit /b 1
              )
              echo GitHub token saved. Future runs will use it automatically.
              echo.
          )
          if not defined GH_TOKEN (
              echo ERROR: No GitHub token was supplied.
              echo.
              pause
              exit /b 1
          )
          echo Checking GitHub Actions for the latest successful main build...
          set "LATEST_RUN="
          for /f "delims=" %%I in ('gh run list --repo candoo32-glitch/esp32-c3-pc-relay --workflow build.yml --branch main --status success --limit 1 --json databaseId --jq ".[0].databaseId"') do set "LATEST_RUN=%%I"
          if not defined LATEST_RUN (
              echo ERROR: No successful main-branch build was found.
              echo.
              pause
              exit /b 1
          )
          echo Latest successful build: !LATEST_RUN!
          set "DOWNLOAD_DIR=%TEMP%\esp32-c3-relay-%RANDOM%%RANDOM%"
          set "LOCAL_DIR=%~dp0"
          set "LOCAL_FIRMWARE=!LOCAL_DIR!firmware"
          mkdir "!DOWNLOAD_DIR!" >nul 2>&1
          echo Downloading compiled firmware artifact...
          gh run download !LATEST_RUN! --repo candoo32-glitch/esp32-c3-pc-relay --name esp32-c3-pc-relay-firmware --dir "!DOWNLOAD_DIR!"
          if errorlevel 1 (
              echo ERROR: Could not download the GitHub Actions artifact.
              rmdir /s /q "!DOWNLOAD_DIR!" >nul 2>&1
              echo.
              pause
              exit /b 1
          )
          if not exist "!DOWNLOAD_DIR!\firmware\factory.bin" (
              echo ERROR: Download completed but firmware\factory.bin was not found.
              rmdir /s /q "!DOWNLOAD_DIR!" >nul 2>&1
              echo.
              pause
              exit /b 1
          )
          echo.
          echo Updating local firmware files...
          if exist "!LOCAL_FIRMWARE!" rmdir /s /q "!LOCAL_FIRMWARE!"
          mkdir "!LOCAL_FIRMWARE!" >nul 2>&1
          xcopy /e /i /y /q "!DOWNLOAD_DIR!\firmware" "!LOCAL_FIRMWARE!" >nul
          if errorlevel 1 (
              echo ERROR: Could not update the local firmware directory.
              rmdir /s /q "!DOWNLOAD_DIR!" >nul 2>&1
              echo.
              pause
              exit /b 1
          )
          copy /y "!DOWNLOAD_DIR!\README.txt" "!LOCAL_DIR!README.txt" >nul
          copy /y "!DOWNLOAD_DIR!\SHA256SUMS.txt" "!LOCAL_DIR!SHA256SUMS.txt" >nul
          rmdir /s /q "!DOWNLOAD_DIR!" >nul 2>&1
          echo Local firmware is now synchronized with GitHub.
          echo.
          where py >nul 2>&1
          if errorlevel 1 (
              echo ERROR: Python launcher ^(py^) was not found.
              echo Install Python for Windows with the py launcher enabled.
              echo.
              pause
              exit /b 1
          )
          if not exist "!LOCAL_FIRMWARE!\factory.bin" (
              echo ERROR: Local factory.bin is missing after synchronization.
              echo.
              pause
              exit /b 1
          )
          echo Detecting ESP32-C3 USB Serial/JTAG device...
          echo.
          py -m esptool --chip esp32c3 --port-filter vid=0x303A --port-filter pid=0x1001 --after hard-reset write-flash 0x0 "!LOCAL_FIRMWARE!\factory.bin"
          set "FLASH_EXIT=!ERRORLEVEL!"
          echo.
          if not "!FLASH_EXIT!"=="0" (
              echo ========================================
              echo   FLASH FAILED
              echo ========================================
              echo.
              echo esptool exited with error code !FLASH_EXIT!.
              echo The complete esptool output is shown above.
              echo.
              echo Make sure the ESP32-C3 is connected by USB
              echo and is in download mode if required.
              echo.
              echo Press any key to close this window...
              pause >nul
              exit /b !FLASH_EXIT!
          )
          echo ========================================
          echo   FLASH SUCCESSFUL
          echo ========================================
          echo.
          echo The ESP32-C3 has been flashed successfully.
          echo.
          echo Press any key to close this window...
          pause >nul
          endlocal
          EOF

          cat > dist/README.txt <<'EOF'
          ESP32-C3 PC Relay Firmware
          ==========================
          Windows flasher layout:
              flash.bat
              firmware\
                  factory.bin
                  firmware.bin
                  bootloader.bin
                  partitions.bin
                  boot_app0.bin
                  firmware.elf
              README.txt
              SHA256SUMS.txt
          Usage:
          1. Connect the ESP32-C3 to USB.
          2. Double-click flash.bat.
          3. The script finds the latest successful main-branch GitHub Actions build and downloads the compiled firmware automatically.
          4. If GH_TOKEN is already set in Windows, it is used automatically. Otherwise the script securely prompts for a fine-grained GitHub token for that run only.
          5. The downloaded firmware replaces the local firmware\ directory.
          6. The temporary download directory is deleted.
          7. esptool flashes firmware\factory.bin.
          Required Windows software:
          - GitHub CLI (gh)
          - Python launcher (py)
          - esptool installed for Python
          The GitHub token is never stored in this repository.
          On first run, flash.bat securely prompts for the token and saves it as the Windows user environment variable GH_TOKEN. Future runs use that saved value automatically. Remove GH_TOKEN from Windows user environment variables to require a new token.
          EOF

          sha256sum             dist/firmware/factory.bin             dist/firmware/firmware.bin             dist/firmware/firmware.elf             dist/firmware/bootloader.bin             dist/firmware/partitions.bin             dist/firmware/boot_app0.bin             dist/flash.bat             dist/README.txt             > dist/SHA256SUMS.txt

          test -s dist/flash.bat
          test -s dist/README.txt
          test -s dist/SHA256SUMS.txt
          test -s dist/firmware/factory.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-c3-pc-relay-firmware
          path: dist/
          if-no-files-found: error
          retention-days: 30
