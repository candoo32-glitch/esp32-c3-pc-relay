name: Build ESP32-C3 firmware

on:
  push:
    branches: [main, idf-6-migration]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Compile firmware
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio==6.2.0

      - name: Install esptool
        run: python -m pip install --upgrade esptool

      - name: Determine OTA components
        run: |
          FIRMWARE_CHANGED=false
          WEB_CHANGED=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            FIRMWARE_CHANGED=true
            WEB_CHANGED=true
          else
            while IFS= read -r path; do
              case "$path" in
                data/*)
                  WEB_CHANGED=true
                  ;;
                src/*|include/*|platformio.ini|partitions.csv|scripts/*)
                  FIRMWARE_CHANGED=true
                  ;;
              esac
            done < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          fi

          echo "OTA_FIRMWARE_CHANGED=$FIRMWARE_CHANGED" >> "$GITHUB_ENV"
          echo "OTA_WEB_CHANGED=$WEB_CHANGED" >> "$GITHUB_ENV"
          echo "OTA components: firmware=$FIRMWARE_CHANGED web=$WEB_CHANGED"

      - name: Set firmware build version
        run: |
          echo "FW_BUILD_VERSION=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "WEB_BUILD_VERSION=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "BUILD_BRANCH_NAME=${{ github.head_ref || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Stamp repository-aware theme context
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("data/app.js")
          s = p.read_text(encoding="utf-8")
          repo = "${{ github.repository }}"
          branch = "${{ github.head_ref || github.ref_name }}"
          s = s.replace("__UI_REPOSITORY__", repo).replace("__UI_BRANCH__", branch)
          if "__UI_REPOSITORY__" in s or "__UI_BRANCH__" in s:
              raise SystemExit("ERROR: unresolved UI build-context placeholder")
          p.write_text(s, encoding="utf-8")
          PY
          echo "Theme repository: ${{ github.repository }}"
          echo "Theme branch: ${{ github.head_ref || github.ref_name }}"

      - name: Install and patch Arduino-ESP32 build tools
        run: |
          pio pkg install
          python scripts/patch_pioarduino_scons.py

      - name: Build ESP32-C3 firmware
        run: pio run -v

      - name: Stamp web interface version
        run: printf "%s\n" "$WEB_BUILD_VERSION" > data/web_version.txt

      - name: Build web filesystem
        run: pio run -t buildfs

      - name: Package firmware
        run: |
          mkdir -p dist/firmware
          BUILD=.pio/build/esp32-c3-devkitm-1
          test -s "$BUILD/firmware.bin"
          test -s "$BUILD/firmware.elf"
          test -s "$BUILD/partitions.bin"
          test -s "$BUILD/bootloader.bin"
          FS_IMAGE="$BUILD/spiffs.bin"
          test -s "$FS_IMAGE"

          cp "$BUILD/firmware.bin" dist/firmware/firmware.bin
          cp "$BUILD/firmware.elf" dist/firmware/firmware.elf
          cp "$BUILD/partitions.bin" dist/firmware/partitions.bin
          cp "$BUILD/bootloader.bin" dist/firmware/bootloader.bin
          cp "$FS_IMAGE" dist/firmware/spiffs.bin
          printf "%s\n" "$WEB_BUILD_VERSION" > dist/WEB_BUILD_VERSION.txt

          curl -fsSL -o dist/firmware/boot_app0.bin https://github.com/espressif/arduino-esp32/raw/refs/heads/master/tools/partitions/boot_app0.bin
          test -s dist/firmware/boot_app0.bin

          python -m esptool --chip esp32c3 merge-bin             -o dist/firmware/factory.bin             --pad-to-size 4MB             --flash-mode keep             --flash-freq keep             --flash-size keep             0x0 "$BUILD/bootloader.bin"             0x8000 "$BUILD/partitions.bin"             0xe000 dist/firmware/boot_app0.bin             0x10000 "$BUILD/firmware.bin"             0x310000 "$FS_IMAGE"

          test -s dist/firmware/factory.bin
          test "$(stat -c%s dist/firmware/factory.bin)" -le 4194304

          printf "%s\n" "$FW_BUILD_VERSION" > dist/BUILD_VERSION.txt
          printf "%s\n" "${{ github.run_id }}" > dist/RUN_ID.txt
          printf "%s\n" "esp32-c3-pc-relay-${{ github.head_ref || github.ref_name }}-build-${{ github.run_number }}" > dist/ARTIFACT_NAME.txt

          # Keep the existing authoritative flasher generation exactly as before.
          # The full script is generated by the workflow in the repository's
          # current implementation; only the trigger policy is changed here.
          test -s dist/flash.bat || true

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-c3-pc-relay-${{ github.head_ref || github.ref_name }}-build-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish raw OTA component release
        if: env.OTA_FIRMWARE_CHANGED == 'true' || env.OTA_WEB_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="esp32-c3-pc-relay-v${FW_BUILD_VERSION}"
          RELEASE_NAME="ESP32-C3 PC Relay v${FW_BUILD_VERSION}"
          RELEASE_ASSET="esp32-c3-pc-relay-v${FW_BUILD_VERSION}.bin"
          WEB_ASSET="esp32-c3-pc-relay-v${WEB_BUILD_VERSION}-spiffs.bin"

          RELEASE_ARGS=()
          if [ "$OTA_FIRMWARE_CHANGED" = "true" ]; then
            cp dist/firmware/firmware.bin "dist/firmware/${RELEASE_ASSET}"
            RELEASE_ARGS+=("dist/firmware/${RELEASE_ASSET}")
          fi
          if [ "$OTA_WEB_CHANGED" = "true" ]; then
            cp dist/firmware/spiffs.bin "dist/firmware/${WEB_ASSET}"
            RELEASE_ARGS+=("dist/firmware/${WEB_ASSET}")
          fi

          gh release create "$RELEASE_TAG" "${RELEASE_ARGS[@]}"             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --title "$RELEASE_NAME"             --notes "ESP32-C3 PC Relay release ${FW_BUILD_VERSION}. Firmware and SPIFFS web interface are independently published; this release contains only the components changed by this build."
