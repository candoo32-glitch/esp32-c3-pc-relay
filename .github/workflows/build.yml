name: Build ESP32-C3 firmware

on:
  push:
    branches: [idf-6-migration]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Compile firmware
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio==6.2.0

      - name: Install esptool
        run: python -m pip install --upgrade esptool

      - name: Set firmware build version
        run: |
          echo "FW_BUILD_VERSION=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "BUILD_BRANCH_NAME=${{ github.head_ref || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Install and patch Arduino-ESP32 build tools
        run: |
          pio pkg install
          python scripts/patch_pioarduino_scons.py

      - name: Build ESP32-C3 firmware
        run: pio run -v

      - name: Package firmware
        run: |
          mkdir -p dist/firmware
          BUILD=.pio/build/esp32-c3-devkitm-1

          test -s "$BUILD/firmware.bin"
          test -s "$BUILD/firmware.elf"
          test -s "$BUILD/partitions.bin"
          test -s "$BUILD/bootloader.bin"

          cp "$BUILD/firmware.bin" dist/firmware/firmware.bin
          cp "$BUILD/firmware.elf" dist/firmware/firmware.elf
          cp "$BUILD/partitions.bin" dist/firmware/partitions.bin
          cp "$BUILD/bootloader.bin" dist/firmware/bootloader.bin

          echo "Downloading boot_app0.bin"
          curl -fsSL -o dist/firmware/boot_app0.bin             https://github.com/espressif/arduino-esp32/raw/refs/heads/master/tools/partitions/boot_app0.bin

          test -s dist/firmware/boot_app0.bin

          python -m esptool --chip esp32c3 merge-bin             -o dist/firmware/factory.bin             --pad-to-size 4MB             --flash-mode keep             --flash-freq keep             --flash-size keep             0x0 "$BUILD/bootloader.bin"             0x8000 "$BUILD/partitions.bin"             0xe000 dist/firmware/boot_app0.bin             0x10000 "$BUILD/firmware.bin"

          test -s dist/firmware/factory.bin
          test "$(stat -c%s dist/firmware/factory.bin)" -eq 4194304

          printf "%s\\n" "$FW_BUILD_VERSION" > dist/BUILD_VERSION.txt
          printf "%s\\n" "${{ github.run_id }}" > dist/RUN_ID.txt
          printf "%s\\n" "esp32-c3-pc-relay-${{ github.head_ref || github.ref_name }}-build-${{ github.run_number }}" > dist/ARTIFACT_NAME.txt

          cat > dist/flash.bat <<'EOF'
          @echo off
          set "INTERNAL_UPDATE=0"
          if /I "%~1"=="__ESP32_INTERNAL" set "INTERNAL_UPDATE=1"
          if /I not "%~1"=="__ESP32_INTERNAL" (
          "%ComSpec%" /d /c call "%~f0" __ESP32_INTERNAL
          exit /b 0
          )
          setlocal EnableExtensions EnableDelayedExpansion

          rem Enable ANSI/VT escape sequences without using the Windows COLOR command.
          for /f "delims=" %%E in ('echo prompt $E^| cmd') do set "ESC=%%E"

          title ESP32-C3 PC Relay Firmware Flasher
          echo !ESC![96m
          echo.
          echo ========================================
          echo   ESP32-C3 PC Relay Firmware Flasher
          echo ========================================
          echo.

          where gh >nul 2>&1
          if errorlevel 1 (
              echo !ESC![91m
          echo ERROR: GitHub CLI ^(gh^) was not found.
              echo Install GitHub CLI before using this flasher.
              echo.
              pause
              exit /b 1
          )
          where py >nul 2>&1
          if errorlevel 1 (
              echo !ESC![91m
          echo ERROR: Python launcher ^(py^) was not found.
              echo Install Python for Windows with the py launcher enabled.
              echo.
              pause
              exit /b 1
          )

          if not defined GH_TOKEN (
              echo GitHub token is not configured.
              echo.
              echo Enter your GitHub fine-grained token.
              echo It will be saved for future runs as the Windows user variable GH_TOKEN.
              echo.
              for /f "delims=" %%T in ('powershell -NoProfile -Command "$s=Read-Host Token -AsSecureString; $b=[Runtime.InteropServices.Marshal]::SecureStringToBSTR($s); try { $t=[Runtime.InteropServices.Marshal]::PtrToStringBSTR($b); [Environment]::SetEnvironmentVariable('GH_TOKEN',$t,'User'); $t } finally { [Runtime.InteropServices.Marshal]::ZeroFreeBSTR($b) }"') do set "GH_TOKEN=%%T"
              echo.
              if not defined GH_TOKEN (
                  echo !ESC![91m
          echo ERROR: Token was not saved.
                  echo.
                  pause
                  exit /b 1
              )
              echo GitHub token saved. Future runs will use it automatically.
              echo.
          )

          set "TARGET_BRANCH=${{ github.head_ref || github.ref_name }}"

          rem Self-update from the newest successful artifact on this branch.
          rem The downloaded artifact contains the authoritative flash.bat.
          set "FLASHER_BUILD=${{ github.run_number }}"
          set "SELF_UPDATE_DIR=%TEMP%\\esp32-c3-flasher-update-%RANDOM%%RANDOM%"
          set "SELF_UPDATE_EXTRACT=!SELF_UPDATE_DIR!\\extracted"
          set "SELF_PATH=%~f0"
          mkdir "!SELF_UPDATE_DIR!" >nul 2>&1
          mkdir "!SELF_UPDATE_EXTRACT!" >nul 2>&1

          echo Checking for a newer flasher...
          set "UPDATE_RUN="
          set "UPDATE_RUN_NUMBER="
          set "UPDATE_RUN_STATUS="
          set "UPDATE_RUN_CONCLUSION="

          for /f "delims=" %%I in ('gh run list --repo candoo32-glitch/esp32-c3-pc-relay --workflow build.yml --branch "!TARGET_BRANCH!" --limit 1 --json databaseId --jq ".[0].databaseId"') do set "UPDATE_RUN=%%I"

          if not defined UPDATE_RUN (
              echo !ESC![91m
          echo ERROR: Could not determine the newest build for flasher update.
              rmdir /s /q "!SELF_UPDATE_DIR!" >nul 2>&1
              pause
              exit /b 1
          )

          :WAIT_FOR_FLASHER_UPDATE_RUN
          if not defined WAIT_SECONDS set "WAIT_SECONDS=0"
          set "UPDATE_RUN_NUMBER="
          set "UPDATE_RUN_STATUS="
          set "UPDATE_RUN_CONCLUSION="
          for /f "delims=" %%I in ('gh run view "!UPDATE_RUN!" --repo candoo32-glitch/esp32-c3-pc-relay --json number --jq ".number"') do set "UPDATE_RUN_NUMBER=%%I"
          for /f "delims=" %%I in ('gh run view "!UPDATE_RUN!" --repo candoo32-glitch/esp32-c3-pc-relay --json status --jq ".status"') do set "UPDATE_RUN_STATUS=%%I"
          for /f "delims=" %%I in ('gh run view "!UPDATE_RUN!" --repo candoo32-glitch/esp32-c3-pc-relay --json conclusion --jq ".conclusion"') do set "UPDATE_RUN_CONCLUSION=%%I"

          if /I "!UPDATE_RUN_STATUS!"=="queued" (
              set /a WAIT_SECONDS+=10
              <nul set /p "=!ESC![2K!ESC![G!ESC![93mWaiting !WAIT_SECONDS!... Newest build !UPDATE_RUN_NUMBER! is queued."
              timeout /t 10 /nobreak >nul
              goto WAIT_FOR_FLASHER_UPDATE_RUN
          )
          if /I "!UPDATE_RUN_STATUS!"=="in_progress" (
              set /a WAIT_SECONDS+=10
              <nul set /p "=!ESC![2K!ESC![G!ESC![93mWaiting !WAIT_SECONDS!... Newest build !UPDATE_RUN_NUMBER! is in progress."
              timeout /t 10 /nobreak >nul
              goto WAIT_FOR_FLASHER_UPDATE_RUN
          )
          if /I "!UPDATE_RUN_STATUS!"=="waiting" (
              set /a WAIT_SECONDS+=10
              <nul set /p "=!ESC![2K!ESC![G!ESC![93mWaiting !WAIT_SECONDS!... Newest build !UPDATE_RUN_NUMBER! is waiting."
              timeout /t 10 /nobreak >nul
              goto WAIT_FOR_FLASHER_UPDATE_RUN
          )

          if /I not "!UPDATE_RUN_STATUS!"=="completed" (
              echo !ESC![91m
          echo ERROR: Flasher update build !UPDATE_RUN_NUMBER! has unexpected status "!UPDATE_RUN_STATUS!".
              rmdir /s /q "!SELF_UPDATE_DIR!" >nul 2>&1
              pause
              exit /b 1
          )

          if /I not "!UPDATE_RUN_CONCLUSION!"=="success" (
              echo !ESC![91m
          echo ERROR: Newest build !UPDATE_RUN_NUMBER! completed with conclusion "!UPDATE_RUN_CONCLUSION!".
              echo The flasher will not replace itself with a failed build.
              rmdir /s /q "!SELF_UPDATE_DIR!" >nul 2>&1
              pause
              exit /b 1
          )

          if "!UPDATE_RUN_NUMBER!"=="!FLASHER_BUILD!" (
              echo Flasher is already current ^(build !FLASHER_BUILD!^).
              rmdir /s /q "!SELF_UPDATE_DIR!" >nul 2>&1
          ) else (
              set "UPDATE_ARTIFACT_NAME=esp32-c3-pc-relay-!TARGET_BRANCH!-build-!UPDATE_RUN_NUMBER!"
              echo New flasher available from build !UPDATE_RUN_NUMBER!.
              echo Downloading updated flasher...

              gh run download "!UPDATE_RUN!" --repo candoo32-glitch/esp32-c3-pc-relay --name "!UPDATE_ARTIFACT_NAME!" --dir "!SELF_UPDATE_EXTRACT!"
              if errorlevel 1 (
                  echo !ESC![91m
          echo ERROR: Could not download the newer flasher artifact.
                  rmdir /s /q "!SELF_UPDATE_DIR!" >nul 2>&1
                  pause
                  exit /b 1
              )

              if not exist "!SELF_UPDATE_EXTRACT!\\flash.bat" (
                  echo !ESC![91m
          echo ERROR: New artifact does not contain flash.bat.
                  rmdir /s /q "!SELF_UPDATE_DIR!" >nul 2>&1
                  pause
                  exit /b 1
              )

              set "UPDATE_SCRIPT=!SELF_UPDATE_EXTRACT!\\flash.bat"
              set "UPDATE_HELPER=!SELF_UPDATE_DIR!\\replace-flasher.cmd"
              >"!UPDATE_HELPER!" echo @echo off
              >>"!UPDATE_HELPER!" echo timeout /t 1 /nobreak ^>nul
              >>"!UPDATE_HELPER!" echo copy /y "!UPDATE_SCRIPT!" "!SELF_PATH!" ^>nul
              >>"!UPDATE_HELPER!" echo if errorlevel 1 ^(
              >>"!UPDATE_HELPER!" echo     echo ERROR: Could not replace the running flasher.
              >>"!UPDATE_HELPER!" echo     pause
              >>"!UPDATE_HELPER!" echo     exit /b 1
              >>"!UPDATE_HELPER!" echo ^)
              >>"!UPDATE_HELPER!" echo echo Flasher updated to build !UPDATE_RUN_NUMBER!.
              >>"!UPDATE_HELPER!" echo echo Starting updated flasher...
              >>"!UPDATE_HELPER!" echo call "!SELF_PATH!" __ESP32_INTERNAL
              >>"!UPDATE_HELPER!" echo if errorlevel 1 echo Updated flasher exited with errorlevel %%ERRORLEVEL%%.
              >>"!UPDATE_HELPER!" echo exit /b %%ERRORLEVEL%%

              echo !ESC![95m
              echo Updating flash.bat in place...
              echo The current flasher will close while the update helper replaces it.
              echo The helper window will remain open so any update error can be read.
              start "ESP32 Flasher Update" "%ComSpec%" /d /c call "!UPDATE_HELPER!"
              endlocal
              exit /b 0
          )

          set "LATEST_RUN="
          set "LATEST_RUN_NUMBER="
          set "LATEST_RUN_STATUS="
          set "LATEST_RUN_CONCLUSION="
          set "EXPECTED_ARTIFACT_NAME="

          echo Target branch: !TARGET_BRANCH!
          echo Searching GitHub for the newest build on this branch...
          echo.

          rem Always inspect the newest branch run first. If it is queued or
          rem running, wait for that exact run instead of falling back to an
          rem older successful artifact.
          for /f "delims=" %%I in ('gh run list --repo candoo32-glitch/esp32-c3-pc-relay --workflow build.yml --branch "!TARGET_BRANCH!" --limit 1 --json databaseId --jq ".[0].databaseId"') do set "LATEST_RUN=%%I"

          if not defined LATEST_RUN (
              echo !ESC![91m
          echo ERROR: No build was found for branch !TARGET_BRANCH!.
              echo.
              pause
              exit /b 1
          )

          :WAIT_FOR_BUILD
          set "LATEST_RUN_NUMBER="
          set "LATEST_RUN_STATUS="
          set "LATEST_RUN_CONCLUSION="

          for /f "delims=" %%I in ('gh run view "!LATEST_RUN!" --repo candoo32-glitch/esp32-c3-pc-relay --json number --jq ".number"') do set "LATEST_RUN_NUMBER=%%I"
          for /f "delims=" %%I in ('gh run view "!LATEST_RUN!" --repo candoo32-glitch/esp32-c3-pc-relay --json status --jq ".status"') do set "LATEST_RUN_STATUS=%%I"
          for /f "delims=" %%I in ('gh run view "!LATEST_RUN!" --repo candoo32-glitch/esp32-c3-pc-relay --json conclusion --jq ".conclusion"') do set "LATEST_RUN_CONCLUSION=%%I"

          if not defined LATEST_RUN_NUMBER (
              echo !ESC![91m
          echo ERROR: Could not read build !LATEST_RUN!.
              echo.
              pause
              exit /b 1
          )

          if /I "!LATEST_RUN_STATUS!"=="queued" (
              echo !ESC![93m
              echo Build !LATEST_RUN_NUMBER! is queued. Waiting...
              timeout /t 10 /nobreak >nul
              echo !ESC![96m
              goto WAIT_FOR_BUILD
          )

          if /I "!LATEST_RUN_STATUS!"=="in_progress" (
              echo !ESC![93m
              echo Build !LATEST_RUN_NUMBER! is in progress. Waiting...
              timeout /t 10 /nobreak >nul
              echo !ESC![96m
              goto WAIT_FOR_BUILD
          )

          if /I "!LATEST_RUN_STATUS!"=="waiting" (
              echo !ESC![93m
              echo Build !LATEST_RUN_NUMBER! is waiting. Waiting...
              timeout /t 10 /nobreak >nul
              echo !ESC![96m
              goto WAIT_FOR_BUILD
          )

          if /I not "!LATEST_RUN_STATUS!"=="completed" (
              echo !ESC![91m
          echo ERROR: Build !LATEST_RUN_NUMBER! ended in unexpected status "!LATEST_RUN_STATUS!".
              echo.
              pause
              exit /b 1
          )

          if /I not "!LATEST_RUN_CONCLUSION!"=="success" (
              echo !ESC![91m
          echo ERROR: Newest build !LATEST_RUN_NUMBER! completed with conclusion "!LATEST_RUN_CONCLUSION!".
              echo The flasher will not fall back to an older build.
              echo.
              pause
              exit /b 1
          )

          set "EXPECTED_ARTIFACT_NAME=esp32-c3-pc-relay-!TARGET_BRANCH!-build-!LATEST_RUN_NUMBER!"
          echo Selected GitHub Actions run : !LATEST_RUN!
          echo Selected build number       : !LATEST_RUN_NUMBER!
          echo Expected artifact          : !EXPECTED_ARTIFACT_NAME!
          echo.
          set "DOWNLOAD_DIR=%TEMP%\esp32-c3-relay-%RANDOM%%RANDOM%"
          set "EXTRACT_DIR=!DOWNLOAD_DIR!\extracted"
          set "LOCAL_DIR=%~dp0"
          set "LOCAL_FIRMWARE=!LOCAL_DIR!firmware"
          mkdir "!DOWNLOAD_DIR!" >nul 2>&1
          mkdir "!EXTRACT_DIR!" >nul 2>&1

          echo Downloading the exact artifact from run !LATEST_RUN!...
          gh run download "!LATEST_RUN!" --repo candoo32-glitch/esp32-c3-pc-relay --name "!EXPECTED_ARTIFACT_NAME!" --dir "!EXTRACT_DIR!"
          if errorlevel 1 (
              echo !ESC![91m
          echo ERROR: GitHub artifact download failed.
              rmdir /s /q "!DOWNLOAD_DIR!" >nul 2>&1
              echo.
              pause
              exit /b 1
          )

          if not exist "!EXTRACT_DIR!\firmware\factory.bin" (
              echo !ESC![91m
          echo ERROR: Extracted artifact does not contain firmware\factory.bin.
              echo.
              dir /s /b "!EXTRACT_DIR!"
              rmdir /s /q "!DOWNLOAD_DIR!" >nul 2>&1
              pause
              exit /b 1
          )
          if not exist "!EXTRACT_DIR!\BUILD_VERSION.txt" (
              echo !ESC![91m
          echo ERROR: BUILD_VERSION.txt is missing from the artifact.
              rmdir /s /q "!DOWNLOAD_DIR!" >nul 2>&1
              echo.
              pause
              exit /b 1
          )
          if not exist "!EXTRACT_DIR!\RUN_ID.txt" (
              echo !ESC![91m
          echo ERROR: RUN_ID.txt is missing from the artifact.
              rmdir /s /q "!DOWNLOAD_DIR!" >nul 2>&1
              echo.
              pause
              exit /b 1
          )
          if not exist "!EXTRACT_DIR!\ARTIFACT_NAME.txt" (
              echo !ESC![91m
          echo ERROR: ARTIFACT_NAME.txt is missing from the artifact.
              rmdir /s /q "!DOWNLOAD_DIR!" >nul 2>&1
              echo.
              pause
              exit /b 1
          )

          set /p "ARTIFACT_BUILD_VERSION="<"!EXTRACT_DIR!\BUILD_VERSION.txt"
          set /p "ARTIFACT_RUN_ID="<"!EXTRACT_DIR!\RUN_ID.txt"
          set /p "ACTUAL_ARTIFACT_NAME="<"!EXTRACT_DIR!\ARTIFACT_NAME.txt"
          if not "!ACTUAL_ARTIFACT_NAME!"=="!EXPECTED_ARTIFACT_NAME!" (
              echo !ESC![91m
          echo ERROR: Artifact name mismatch.
              echo Expected: !EXPECTED_ARTIFACT_NAME!
              echo Artifact : !ACTUAL_ARTIFACT_NAME!
              rmdir /s /q "!DOWNLOAD_DIR!" >nul 2>&1
              echo.
              pause
              exit /b 1
          )
          if not "!ARTIFACT_RUN_ID!"=="!LATEST_RUN!" (
              echo !ESC![91m
          echo ERROR: Artifact run ID mismatch.
              echo Expected: !LATEST_RUN!
              echo Artifact : !ARTIFACT_RUN_ID!
              rmdir /s /q "!DOWNLOAD_DIR!" >nul 2>&1
              echo.
              pause
              exit /b 1
          )
          if not defined ARTIFACT_BUILD_VERSION (
              echo !ESC![91m
          echo ERROR: Artifact firmware build version is empty.
              rmdir /s /q "!DOWNLOAD_DIR!" >nul 2>&1
              echo.
              pause
              exit /b 1
          )

          echo.
          echo !ESC![92m
          echo ========================================
          echo   VERIFIED FIRMWARE
          echo ========================================
          echo GitHub Actions run : !ARTIFACT_RUN_ID!
          echo Firmware build     : !ARTIFACT_BUILD_VERSION!
          echo Artifact name      : !ACTUAL_ARTIFACT_NAME!
          echo Factory image      : 4194304 bytes
          echo ========================================
          echo.
          echo !ESC![96m

          echo Updating local firmware files...
          if exist "!LOCAL_FIRMWARE!" rmdir /s /q "!LOCAL_FIRMWARE!"
          mkdir "!LOCAL_FIRMWARE!" >nul 2>&1
          xcopy /e /i /y /q "!EXTRACT_DIR!\firmware" "!LOCAL_FIRMWARE!" >nul
          if errorlevel 1 (
              echo !ESC![91m
          echo ERROR: Could not update the local firmware directory.
              rmdir /s /q "!DOWNLOAD_DIR!" >nul 2>&1
              echo.
              pause
              exit /b 1
          )
          copy /y "!EXTRACT_DIR!\README.txt" "!LOCAL_DIR!README.txt" >nul
          copy /y "!EXTRACT_DIR!\SHA256SUMS.txt" "!LOCAL_DIR!SHA256SUMS.txt" >nul
          copy /y "!EXTRACT_DIR!\BUILD_VERSION.txt" "!LOCAL_DIR!BUILD_VERSION.txt" >nul
          copy /y "!EXTRACT_DIR!\RUN_ID.txt" "!LOCAL_DIR!RUN_ID.txt" >nul
          copy /y "!EXTRACT_DIR!\ARTIFACT_NAME.txt" "!LOCAL_DIR!ARTIFACT_NAME.txt" >nul
          rmdir /s /q "!DOWNLOAD_DIR!" >nul 2>&1

          if not exist "!LOCAL_FIRMWARE!\factory.bin" (
              echo !ESC![91m
          echo ERROR: Local factory.bin is missing after synchronization.
              echo.
              pause
              exit /b 1
          )
          echo Local firmware is synchronized with verified GitHub build !ARTIFACT_BUILD_VERSION!.
          echo.
          echo The verified image is ready to flash.
          echo.
          py -m esptool --chip esp32c3 --port-filter vid=0x303A --port-filter pid=0x1001 --after hard-reset write-flash 0x0 "!LOCAL_FIRMWARE!\bootloader.bin" 0x8000 "!LOCAL_FIRMWARE!\partitions.bin" 0xe000 "!LOCAL_FIRMWARE!\boot_app0.bin" 0x10000 "!LOCAL_FIRMWARE!\firmware.bin"
          set "FLASH_EXIT=!ERRORLEVEL!"
          echo.
          if not "!FLASH_EXIT!"=="0" (
              echo !ESC![91m
              echo ========================================
              echo   FLASH FAILED
              echo ========================================
              echo.
              echo esptool exited with error code !FLASH_EXIT!.
              echo The complete esptool output is shown above.
              echo.
              pause
              exit /b !FLASH_EXIT!
          )
          echo !ESC![92m
          echo ========================================
          echo   FLASH SUCCESSFUL
          echo ========================================
          echo Firmware build !ARTIFACT_BUILD_VERSION! was flashed.
          echo NVS was preserved by flashing bootloader, partitions, boot_app0, and firmware separately.
          echo.
          echo Opening PuTTY with session profile "ESP"...
          where putty.exe >nul 2>&1
          if not errorlevel 1 (
              start "" putty.exe -load "ESP"
          ) else if exist "%ProgramFiles%\PuTTY\putty.exe" (
              start "" "%ProgramFiles%\PuTTY\putty.exe" -load "ESP"
          ) else if exist "%ProgramFiles(x86)%\PuTTY\putty.exe" (
              start "" "%ProgramFiles(x86)%\PuTTY\putty.exe" -load "ESP"
          ) else (
              echo WARNING: PuTTY was not found. Firmware was flashed successfully.
              echo Install PuTTY or add putty.exe to PATH to open the ESP profile automatically.
          )
          echo.
          echo !ESC![0m
          if "!INTERNAL_UPDATE!"=="0" pause
          endlocal
          EOF
          cat > dist/README.txt <<'EOF'
          ESP32-C3 PC Relay Firmware
          ==========================
          Windows flasher layout:
              flash.bat
              firmware\
                  factory.bin
                  firmware.bin
                  bootloader.bin
                  partitions.bin
                  boot_app0.bin
                  firmware.elf
              README.txt
              SHA256SUMS.txt
          Usage:
          1. Connect the ESP32-C3 to USB.
          2. Double-click flash.bat.
          3. The script finds the latest successful GitHub Actions build for the branch this flasher was built for.
          4. It retrieves that exact run's firmware artifact by artifact ID, downloads the ZIP, and explicitly extracts it with PowerShell.
          5. It verifies the artifact run ID and firmware build version before synchronizing local files.
          6. If GH_TOKEN is already set in Windows, it is used automatically. Otherwise the script securely prompts for a fine-grained GitHub token for that run only.
          6. The downloaded firmware replaces the local firmware\ directory.
          7. The temporary download directory is deleted.
          8. esptool flashes firmware\factory.bin.
          Required Windows software:
          - GitHub CLI (gh)
          - Python launcher (py)
          - esptool installed for Python
          The GitHub token is never stored in this repository.
          On first run, flash.bat securely prompts for the token and saves it as the Windows user environment variable GH_TOKEN. Future runs use that saved value automatically. Remove GH_TOKEN from Windows user environment variables to require a new token.
          EOF

          sha256sum             dist/firmware/factory.bin             dist/firmware/firmware.bin             dist/firmware/firmware.elf             dist/firmware/bootloader.bin             dist/firmware/partitions.bin             dist/firmware/boot_app0.bin             dist/flash.bat             dist/README.txt             > dist/SHA256SUMS.txt

          test -s dist/flash.bat
          test -s dist/README.txt
          test -s dist/SHA256SUMS.txt
          test -s dist/BUILD_VERSION.txt
          test -s dist/RUN_ID.txt
          test -s dist/ARTIFACT_NAME.txt
          test -s dist/firmware/factory.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-c3-pc-relay-${{ github.head_ref || github.ref_name }}-build-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
