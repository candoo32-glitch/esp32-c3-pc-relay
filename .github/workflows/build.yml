name: Build ESP32-C3 firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile firmware
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Install esptool
        run: python -m pip install --upgrade esptool

      - name: Build ESP32-C3 firmware
        run: pio run

      - name: Package firmware
        run: |
          mkdir -p dist
          BUILD=.pio/build/esp32-c3-devkitm-1

          test -s "$BUILD/firmware.bin"
          test -s "$BUILD/firmware.elf"
          test -s "$BUILD/partitions.bin"
          test -s "$BUILD/bootloader.bin"

          cp "$BUILD/firmware.bin" dist/firmware.bin
          cp "$BUILD/firmware.elf" dist/firmware.elf
          cp "$BUILD/partitions.bin" dist/partitions.bin
          cp "$BUILD/bootloader.bin" dist/bootloader.bin

          echo "Downloading boot_app0.bin"
          curl -fsSL -o dist/boot_app0.bin \
            https://github.com/espressif/arduino-esp32/raw/refs/heads/master/tools/partitions/boot_app0.bin

          test -s dist/boot_app0.bin

          python -m esptool --chip esp32c3 merge-bin \
            -o dist/factory.bin \
            --pad-to-size 4MB \
            --flash-mode keep \
            --flash-freq keep \
            --flash-size keep \
            0x0 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0xe000 dist/boot_app0.bin \
            0x10000 "$BUILD/firmware.bin"

          test -s dist/factory.bin
          test "$(stat -c%s dist/factory.bin)" -eq 4194304

          cat > dist/flash.bat <<'EOF'
          @echo off
          setlocal
          title ESP32-C3 PC Relay Firmware Flasher

          echo.
          echo ========================================
          echo   ESP32-C3 PC Relay Firmware Flasher
          echo ========================================
          echo.

          rem Pull the newest successful main-branch build before flashing.
          rem Set ESP32_RELAY_FLASH_LOCAL=1 when this script is invoked by the
          rem downloaded artifact, so the downloaded copy flashes its local image.
          if not "%ESP32_RELAY_FLASH_LOCAL%"=="1" (
              where gh >nul 2>&1
              if errorlevel 1 (
                  echo ERROR: GitHub CLI ^(gh^) was not found.
                  echo Install GitHub CLI and run "gh auth login" once.
                  echo.
                  pause
                  exit /b 1
              )

              echo Checking GitHub Actions for the latest successful main build...
              for /f "delims=" %%I in ('gh run list --repo candoo32-glitch/esp32-c3-pc-relay --workflow build.yml --branch main --status success --limit 1 --json databaseId --jq ".[0].databaseId"') do set "LATEST_RUN=%%I"

              if not defined LATEST_RUN (
                  echo ERROR: No successful main-branch build was found.
                  echo.
                  pause
                  exit /b 1
              )

              echo Latest successful build: %LATEST_RUN%
              set "DOWNLOAD_DIR=%TEMP%\esp32-c3-relay-%RANDOM%%RANDOM%"
              mkdir "%DOWNLOAD_DIR%" >nul 2>&1

              echo Downloading compiled firmware artifact...
              gh run download %LATEST_RUN% --repo candoo32-glitch/esp32-c3-pc-relay --name esp32-c3-pc-relay-firmware --dir "%DOWNLOAD_DIR%"
              if errorlevel 1 (
                  echo ERROR: Could not download the GitHub Actions artifact.
                  rmdir /s /q "%DOWNLOAD_DIR%" >nul 2>&1
                  echo.
                  pause
                  exit /b 1
              )

              if not exist "%DOWNLOAD_DIR%\factory.bin" (
                  echo ERROR: Download completed but factory.bin was not found.
                  rmdir /s /q "%DOWNLOAD_DIR%" >nul 2>&1
                  echo.
                  pause
                  exit /b 1
              )

              echo.
              echo Launching the downloaded build flasher...
              set "ESP32_RELAY_FLASH_LOCAL=1"
              call "%DOWNLOAD_DIR%\flash.bat"
              set "FLASH_EXIT=%ERRORLEVEL%"
              set "ESP32_RELAY_FLASH_LOCAL="
              rmdir /s /q "%DOWNLOAD_DIR%" >nul 2>&1
              exit /b %FLASH_EXIT%
          )

          if not exist "factory.bin" (
              echo ERROR: factory.bin was not found in the downloaded artifact.
              echo.
              pause
              exit /b 1
          )

          where py >nul 2>&1
          if errorlevel 1 (
              echo ERROR: Python launcher ^(py^) was not found.
              echo Install Python for Windows with the py launcher enabled.
              echo.
              pause
              exit /b 1
          )

          echo Detecting ESP32-C3 USB Serial/JTAG device...
          echo.
          py -m esptool --chip esp32c3 --port-filter vid=0x303A --port-filter pid=0x1001 --after hard-reset write-flash 0x0 factory.bin
          set "FLASH_EXIT=%ERRORLEVEL%"

          echo.
          if not "%FLASH_EXIT%"=="0" (
              echo ========================================
              echo   FLASH FAILED
              echo ========================================
              echo.
              echo esptool exited with error code %FLASH_EXIT%.
              echo The complete esptool output is shown above.
              echo.
              echo Make sure the ESP32-C3 is connected by USB
              echo and is in download mode if required.
              echo.
              echo Press any key to close this window...
              pause >nul
              exit /b %FLASH_EXIT%
          )

          echo ========================================
          echo   FLASH SUCCESSFUL
          echo ========================================
          echo.
          echo The ESP32-C3 has been flashed successfully.
          echo.
          echo Press any key to close this window...
          pause >nul
          endlocal
          EOF

          cat > dist/README.txt <<'EOF'
          ESP32-C3 PC Relay Firmware
          ==========================

          First-time USB flashing on Windows:

          1. Connect the ESP32-C3 to USB.
          2. Make sure Python and esptool are installed.
          3. Double-click flash.bat.
          4. The flasher automatically searches for the Espressif USB
             Serial/JTAG interface instead of assuming a COM port number.
          5. Do not connect the motherboard power/reset switch wires until the
             firmware has been bench-tested.

          The factory.bin file is a complete 4 MB ESP32-C3 flash image and is
          written at flash address 0x0.

          The flasher window remains open after success or failure so that the
          complete esptool output and any error information can be reviewed.
          EOF

          sha256sum \
            dist/factory.bin \
            dist/firmware.bin \
            dist/firmware.elf \
            dist/bootloader.bin \
            dist/partitions.bin \
            dist/boot_app0.bin \
            dist/flash.bat \
            dist/README.txt \
            > dist/SHA256SUMS.txt

          test -s dist/flash.bat
          test -s dist/README.txt
          test -s dist/SHA256SUMS.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-c3-pc-relay-firmware
          path: dist/
          if-no-files-found: error
          retention-days: 30
