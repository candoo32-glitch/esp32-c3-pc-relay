<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" preserveAspectRatio="none">
<defs>
 <linearGradient id="steel" x2="0" y2="1"><stop stop-color="#343a3d"/><stop offset=".18" stop-color="#111518"/><stop offset=".55" stop-color="#090c0e"/><stop offset="1" stop-color="#252a2d"/></linearGradient>
 <linearGradient id="brass" x2="0" y2="1"><stop stop-color="#fff0a0"/><stop offset=".12" stop-color="#d79a43"/><stop offset=".42" stop-color="#744216"/><stop offset=".62" stop-color="#e0a653"/><stop offset="1" stop-color="#3b1f0a"/></linearGradient>
 <linearGradient id="copper"><stop stop-color="#3b1208"/><stop offset=".3" stop-color="#d26028"/><stop offset=".5" stop-color="#7b2b12"/><stop offset=".75" stop-color="#e27b35"/><stop offset="1" stop-color="#351007"/></linearGradient>
 <radialGradient id="lamp"><stop stop-color="#fffbd0"/><stop offset=".1" stop-color="#fff05b"/><stop offset=".3" stop-color="#ff981c"/><stop offset=".58" stop-color="#c63b0d"/><stop offset="1" stop-color="#210703"/></radialGradient>
 <radialGradient id="green"><stop stop-color="#eaffbc"/><stop offset=".16" stop-color="#7cff27"/><stop offset=".4" stop-color="#31a50f"/><stop offset="1" stop-color="#061004"/></radialGradient>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f1dca4"/><stop offset=".5" stop-color="#c7a96d"/><stop offset="1" stop-color="#8c6b39"/></linearGradient>
 <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#d18b37" stroke-opacity=".09"/></pattern>
 <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".8"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
 <g id="bolt"><circle r="8" fill="url(#brass)" stroke="#1c0d05" stroke-width="3"/><circle r="2" fill="#fff1a1"/></g>
 <g id="gear"><circle r="46" fill="#141719" stroke="url(#brass)" stroke-width="9"/><circle r="25" fill="#202427" stroke="#8d5922" stroke-width="4"/><circle r="7" fill="#d79b48"/><path d="M0-44v-15M0 44v15M44 0h15M-44 0h-15M31-31l11-11M-31 31l-11 11M31 31l11 11M-31-31l-11-11" stroke="#b7792d" stroke-width="10" stroke-linecap="round"/></g>
 <g id="tube"><rect x="-19" y="-72" width="38" height="144" rx="18" fill="#111518" stroke="url(#brass)" stroke-width="6"/><ellipse rx="10" ry="49" fill="#ff6a16" opacity=".7" filter="url(#glow)"/><path d="M-7-43L7 43M7-43L-7 43M0-52V52" stroke="#ff9a31" stroke-width="3"/><rect x="-24" y="-70" width="48" height="18" rx="5" fill="url(#brass)"/><rect x="-24" y="52" width="48" height="18" rx="5" fill="url(#brass)"/></g>
 <g id="knob"><circle r="31" fill="#17191a" stroke="#b67529" stroke-width="7"/><circle r="23" fill="url(#brass)"/><circle r="13" fill="#28221a"/><path d="M0-8V-22" stroke="#f7d27d" stroke-width="4" stroke-linecap="round"/></g>
 <g id="gauge"><circle r="82" fill="#171b1d" stroke="#9b6227" stroke-width="9"/><circle r="72" fill="#d5c08e" stroke="#24170d" stroke-width="3"/><path d="M-52 36A64 64 0 0 1 52 36" fill="none" stroke="#302315" stroke-width="2"/><path d="M-58 28l8-3M-46 6l9-2M-25-28l5 9M0-40v11M25-28l-5 9M46 6l-9-2M58 28l-8-3" stroke="#17100b" stroke-width="4"/><path d="M-40 27L0 0" stroke="#19110a" stroke-width="7" stroke-linecap="round"/><circle r="11" fill="#27201a" stroke="#c18a40" stroke-width="4"/></g>
</defs>

<!-- full machine plate -->
