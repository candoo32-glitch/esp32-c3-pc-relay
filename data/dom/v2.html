<!--
  ESP32-C3 PC Relay — optional DOM V2 extension.
  V1 never depends on this file.
-->
<template id="builtin-dom-v2-extension">
  <div id="dom-v2-root" hidden
       data-dom-v2="active"
       data-v2-runtime="/dom/v2-runtime.js"
       data-v2-style="/dom/v2.css"
       data-poll-ms="1000">
    <div id="dom-v2-test-hook">DOM V2 ACTIVE</div>
  </div>
</template>
